name: OBI/OFI Data Collection

on:
  workflow_dispatch:
    inputs:
      action:
        description: 'Action to perform'
        required: true
        default: 'start'
        type: choice
        options:
          - start
          - stop
          - status
  schedule:
    - cron: '0 */6 * * *'  # Every 6 hours

concurrency:
  group: obi-data-collection
  cancel-in-progress: false

env:
  DRY_RUN: "true"
  ENVIRONMENT: "development"
  PYTHONUNBUFFERED: "1"

permissions:
  contents: write
  actions: write

jobs:
  collect:
    name: OBI/OFI Data Collection
    runs-on: ubuntu-latest
    timeout-minutes: 350  # ~5.8h (6h schedule - buffer)

    steps:
      - name: Check if stop requested
        if: github.event.inputs.action == 'stop'
        run: echo "::notice::Stop requested. Exiting." && exit 0

      - uses: actions/checkout@v4
        with:
          ref: feature/remove-oracles-formula-audit
          fetch-depth: 0

      - name: Set up Python 3.11
        uses: actions/setup-python@v7
        with:
          python-version: "3.11"
          cache: 'pip'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          which sqlite3 || sudo apt-get install -y sqlite3

      # Restore state from cache
      - name: Restore state from cache
        uses: actions/cache@v4
        id: cache-state
        with:
          path: |
            data/
            memory/
          key: obi-data-${{ github.run_id }}
          restore-keys: |
            obi-data-

      # Seed decision_logs with OBI/OFI data if not present
      - name: Seed decision_logs from snapshot
        run: |
          # Check if scanned entries already exist
          SCANNED_COUNT=$(sqlite3 data/dmarket_state.db "SELECT COUNT(*) FROM decision_logs WHERE decision='scanned';" 2>/dev/null || echo "0")
          echo "Existing scanned entries: $SCANNED_COUNT"
          if [ "$SCANNED_COUNT" -lt 100 ] && [ -f .github/seed/decision_logs_seed.sql.gz ]; then
            echo "Seeding from committed snapshot..."
            mkdir -p data
            # Create table if not exists (no Python needed)
            sqlite3 data/dmarket_state.db "CREATE TABLE IF NOT EXISTS decision_logs (id INTEGER PRIMARY KEY AUTOINCREMENT, hash_name TEXT NOT NULL, decision TEXT NOT NULL, reason TEXT NOT NULL, details TEXT, timestamp REAL NOT NULL);"
            # Import seed data with INSERT OR IGNORE to avoid duplicates
            # Filter out CREATE TABLE (already created above) and BEGIN/COMMIT
            gunzip -c .github/seed/decision_logs_seed.sql.gz | \
              grep -v "^CREATE TABLE\|^BEGIN\|^COMMIT\|^PRAGMA" | \
              sed 's/INSERT INTO/INSERT OR IGNORE INTO/g' | \
              sqlite3 data/dmarket_state.db
            COUNT=$(sqlite3 data/dmarket_state.db "SELECT COUNT(*) FROM decision_logs;")
            echo "Total decision_logs after seed: $COUNT"
          else
            echo "Sufficient data exists ($SCANNED_COUNT scanned entries) — skipping seed"
          fi

      # Run bot
      - name: Run data collection
        env:
          DMARKET_PUBLIC_KEY: ${{ secrets.DMARKET_PUBLIC_KEY }}
          DMARKET_SECRET_KEY: ${{ secrets.DMARKET_SECRET_KEY }}
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          DRY_RUN: "true"
          SCAN_INTERVAL: "120"
        run: |
          echo "Starting OBI/OFI data collection..."
          echo "Start time: $(date -u '+%Y-%m-%dT%H:%M:%SZ')"
          # Run for ~5.5h (leave buffer for cache save)
          timeout 19800 python -m src || true
          echo "Collection cycle complete"

      # Progress report
      - name: Progress report
        if: always()
        run: |
          python scripts/check_obi_progress.py || true
          echo ""
          echo "=== Duplicate check ==="
          sqlite3 data/dmarket_state.db \
            "SELECT COUNT(*) as duplicates FROM (
              SELECT hash_name, timestamp FROM decision_logs
              WHERE decision='scanned'
              GROUP BY hash_name, timestamp HAVING COUNT(*) > 1
            );" || true

      # Save state
      - name: Save state to cache
        if: always()
        uses: actions/cache/save@v4
        with:
          path: |
            data/
            memory/
          key: obi-data-${{ github.run_id }}

      # Update seed for future runs
      - name: Update seed snapshot
        if: always()
        run: |
          if [ -f data/dmarket_state.db ]; then
            sqlite3 data/dmarket_state.db ".dump decision_logs" | gzip > .github/seed/decision_logs_seed.sql.gz
            echo "Updated seed snapshot"
          fi
