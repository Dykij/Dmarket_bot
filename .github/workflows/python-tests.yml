name: Python Tests

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.12", "3.13"]

    steps:
    - uses: actions/checkout@v4

    - name: Set up Python ${{ matrix.python-version }}
      uses: actions/setup-python@v5
      with:
        python-version: ${{ matrix.python-version }}

    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        pip install -r requirements.txt
        pip install pytest pytest-cov vulture pyyaml

    - name: Lint with ruff
      run: |
        pip install ruff
        ruff check src/ --select=E,F --ignore=E501

    - name: Run tests
      run: |
        pytest tests/unit/ -v --tb=short --cov=src --cov-report=term-missing

    - name: Module manifest audit
      run: |
        pytest tests/test_module_manifest.py -v --tb=short

    - name: Dead code check (vulture)
      run: |
        vulture src/ tests/ --min-confidence=80
