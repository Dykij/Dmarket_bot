name: OBI collector (6-week DRY_RUN test)

on:
  workflow_dispatch:
    inputs:
      ref:
        description: "Коммит или тег с кодом сборщика (для пробного запуска укажи хеш)"
        required: true
        default: "collect-v1"
      duration_min:
        description: "Сколько минут собирать (5..340)"
        required: true
        default: "330"
  # Расписание включается отдельным маленьким коммитом после успешного пробного запуска:
  # schedule:
  #   - cron: "17 */6 * * *"

concurrency:
  group: obi-collector
  cancel-in-progress: false

permissions:
  contents: write

defaults:
  run:
    shell: bash

jobs:
  collect:
    name: Collect order-book snapshots
    runs-on: ubuntu-latest
    timeout-minutes: 355
    env:
      PYTHONUNBUFFERED: "1"
      DURATION_MIN: ${{ github.event.inputs.duration_min || '330' }}
      RUN_LABEL: run${{ github.run_id }}-a${{ github.run_attempt }}
    steps:
      - name: Validate inputs
        run: |
          [[ "$DURATION_MIN" =~ ^[0-9]+$ ]] || { echo "duration_min должен быть числом" >&2; exit 2; }
          if (( DURATION_MIN < 5 || DURATION_MIN > 340 )); then
            echo "duration_min вне диапазона 5..340" >&2; exit 2
          fi

      - name: Checkout collector code
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.inputs.ref || 'collect-v1' }}
          path: code
          persist-credentials: false

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: code/requirements.txt

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r code/requirements.txt

      - name: Prepare data branch
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          bash code/src/collector/export_data.sh prepare \
            "https://x-access-token:${GH_TOKEN}@github.com/${GITHUB_REPOSITORY}.git" out

      - name: Collect
        working-directory: code
        env:
          DMARKET_PUBLIC_KEY: ${{ secrets.DMARKET_PUBLIC_KEY }}
          DMARKET_SECRET_KEY: ${{ secrets.DMARKET_SECRET_KEY }}
          DMARKET_REPO: ${{ github.workspace }}/code
        run: |
          mkdir -p ../raw
          secs=$(( DURATION_MIN * 60 ))
          echo "commit: $(git rev-parse HEAD)  duration: ${secs}s  label: ${RUN_LABEL}"
          timeout -k 60 $(( secs + 300 )) python -m src.collector.obi_collector \
            --titles src/collector/titles_v1.txt \
            --out-dir ../raw \
            --interval 300 \
            --duration-sec "$secs" \
            --label "$RUN_LABEL"

      - name: Run summary
        if: always()
        run: |
          ls -la raw 2>/dev/null || true
          cat raw/run_*.json 2>/dev/null || true
          echo "--- статусы тиков:"
          for f in raw/ticks_*.csv; do [ -f "$f" ] && tail -n +2 "$f" | cut -d, -f8 | sort | uniq -c; done || true

      - name: Export to data branch
        if: always()
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: bash code/src/collector/export_data.sh export raw out "$RUN_LABEL"
