name: Dry Run 30-min Test

on:
  workflow_dispatch:
    inputs:
      max_runtime_minutes:
        description: 'Maximum runtime in minutes'
        required: true
        default: '30'

concurrency:
  group: dry-run-30m
  cancel-in-progress: true  # Kill previous run if still going

jobs:
  dry-run:
    runs-on: ubuntu-latest
    timeout-minutes: ${{ fromJSON(github.event.inputs.max_runtime_minutes || '30') }}
    env:
      DRY_RUN: "true"
      DMARKET_PUBLIC_KEY: ${{ secrets.DMARKET_PUBLIC_KEY }}
      DMARKET_SECRET_KEY: ${{ secrets.DMARKET_SECRET_KEY }}
      TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
      TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
      SCAN_INTERVAL: "120"
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: Install dependencies
        run: |
          pip install --upgrade pip
          pip install -r requirements.txt

      - name: Restore state
        uses: actions/cache@v4
        with:
          path: |
            data/
            memory/
          key: dry-run-30m-${{ github.run_id }}
          restore-keys: dry-run-30m-

      - name: Prepare directories
        run: |
          rm -f bot.lock
          mkdir -p data logs memory

      - name: Run DMarket Bot (DRY_RUN, max 30 min)
        env:
          DRY_RUN: "true"
        run: |
          MAX_MIN="${{ github.event.inputs.max_runtime_minutes || '30' }}"
          TIMEOUT_SEC=$((MAX_MIN * 60))
          echo "::notice::Bot will run for max ${MAX_MIN} minutes (${TIMEOUT_SEC}s)"
          timeout "${TIMEOUT_SEC}s" python -m src || EXIT_CODE=$?

          if [ "${EXIT_CODE:-0}" = "124" ]; then
            echo "::notice::Timeout reached at ${MAX_MIN} minutes (expected)"
          elif [ "${EXIT_CODE:-0}" != "0" ]; then
            echo "::warning::Bot exited with code ${EXIT_CODE}"
          fi
          exit 0

      - name: Save state to cache
        if: always()
        uses: actions/cache/save@v4
        with:
          path: |
            data/
            memory/
          key: dry-run-30m-${{ github.run_id }}

      - name: Upload logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: dry-run-30m-logs-${{ github.run_number }}
          path: |
            logs/*.log
            logs/*.json
          retention-days: 7
          if-no-files-found: ignore

      - name: Post-run summary
        if: always()
        run: |
          echo "=== Post-Run Summary ==="
          echo "Duration: max ${{ github.event.inputs.max_runtime_minutes || '30' }} min"
          du -sh data/ 2>/dev/null || echo "  No data"
          ls -lh data/*.db 2>/dev/null || echo "  No DB"
          echo "=== Last 50 log lines ==="
          tail -50 logs/bot_24_7.log 2>/dev/null || tail -50 logs/*.log 2>/dev/null || echo "  No log files found"
          echo "========================"
